# =============================================================================
# Recurrence Light Campaign Configuration
# =============================================================================
#
# Purpose:
#   Use this for breadth-first Gompf campaign runs where the goal is to find
#   certified reductions/frontiers across several focused problems.
#
# Difference from config.yaml:
#   - Codex runs at high rather than xhigh reasoning.
#   - Codex web search is disabled for proof/decomposition calls.
#   - Literature survey and proof summary use Claude to avoid the very large
#     Codex search-heavy context seen in the full profile.
#   - Recurrence explores fewer branches.
#   - Retry counts are lower; failed/uncertain claims should become new focused
#     problem files rather than burning repair rounds.

agent:
  name: "recurrence"
  mission: >
    A mathematics research agent with two recurrence modes: explore mode
    maps nearby positive and negative conjectures before proof search; attack
    mode treats the input statement as a serious conjecture and pushes both
    proof routes and counterexample routes before independent verification.

claude:
  cli_path: "claude"
  permission_mode: "bypassPermissions"
  provider: "subscription"
  subscription:
    model: "sonnet"
  bedrock:
    model: "us.anthropic.claude-opus-4-6-v1[1m]"
    aws_profile: "default"
  api_key:
    model: "claude-opus-4-6"
    key: ""

codex:
  cli_path: "codex"
  model: "gpt-5.5"
  reasoning_effort: "high"
  search: false

gemini:
  cli_path: "gemini"
  model: "gemini-3.1-pro-preview"
  approval_mode: "yolo"
  thinking_level: "HIGH"
  api_key: ""

prover:
  mode: "decomposition"

pipeline:
  literature_survey:
    provider: "claude"
  proof_summary:
    provider: "claude"

  max_proof_iterations: 6

  multi_model:
    enabled: true
    providers: ["codex"]

  verification_agents:
    enabled: true
    providers: ["claude"]

  proof_select:
    provider: "codex"

  verdict:
    provider: "claude"

  brainstorm:
    enabled: false
    providers: ["codex"]

recurrence:
  enabled: true
  mode: "explore"
  provider: "codex"
  positive_conjectures: 4
  negative_conjectures: 4
  branch_budget: 8
  max_depth: 1
  stop_after: "approach_queue"

decomposition:
  max_proof_attempts: 1
  max_revisions: 1
  max_decompositions: 1

  models:
    decomposer: "codex"
    single_prover: "codex"
    regulator: "codex"
    structural_verifier: "claude"
    detailed_verifier: "claude"
    verdict: "claude"

standalone_verifier:
  judge: "codex"
  structural_verifier: "claude"
  detailed_verifier: "claude"
  problem_reviewer: "codex"
